server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  http:
    clients:
      # How long the gateway waits for a service. The read timeout is above the slowest legitimate
      # request (placing an order waits on customer, catalog and possibly a token request).
      connect-timeout: 2s
      read-timeout: 10s
  cloud:
    gateway:
      server:
        webmvc:
          # One route per service, listing exactly the API prefixes it owns. No catch-all route:
          # anything else (/docs, /v3/api-docs, other versions, typos) is answered 404 here and never
          # reaches a service. The gateway makes no authorization decision; each service is an OAuth2
          # resource server with deny-by-default rules.
          routes:
            - id: catalog
              uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/products,/api/v1/products/**,/api/v1/stock/**,/api/v1/reservations/**
            - id: customer
              uri: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/customers/**
            - id: order
              uri: ${ORDER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/orders,/api/v1/orders/**,/api/v1/returns/**
            - id: shipping
              uri: ${SHIPPING_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/shipments,/api/v1/shipments/**

management:
  # Traces (ADR-0011): every request and message, exported to Jaeger over OTLP. Without Jaeger
  # running, export fails quietly and the service works as before.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  # Metrics are pulled by Prometheus from /actuator/prometheus. The OpenTelemetry starter would also
  # push them over OTLP every minute; Jaeger takes traces only, so that push stays off.
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    distribution:
      # Latency buckets, so Prometheus can compute percentiles (p95) across requests and instances.
      percentiles-histogram:
        http.server.requests: true
  # The gateway has no security of its own (each service checks tokens), so its actuator lives on a
  # separate port that is never published to clients. Prometheus scrapes it there.
  server:
    port: ${MANAGEMENT_PORT:8089}
  endpoint:
    health:
      # /actuator/health/liveness ("restart me") and /readiness ("send me traffic"), for container
      # health checks and, in s12, Kubernetes probes. Both stay open like /actuator/health.
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
