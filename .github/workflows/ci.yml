name: CI

on:
  push:
    branches: [main, "sprint/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Unit tests (*Test) and Testcontainers integration tests (*IT); the runner provides Docker.
      - name: Build and test
        run: ./mvnw -B -ntp verify
