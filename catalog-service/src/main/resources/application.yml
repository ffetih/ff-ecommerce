server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: catalog-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${CATALOG_DB_USER:catalog_service}
    password: ${CATALOG_DB_PASSWORD:catalog_service}
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: catalog-service
      auto-offset-reset: earliest
      # Deserialization errors reach the error handler (and the dead-letter topic) instead of failing in poll().
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          # Signing keys are discovered from the issuer; tokens must name this service in "aud".
          issuer-uri: ${ISSUER_URI:http://localhost:8180/realms/ecommerce}
          audiences: catalog-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
