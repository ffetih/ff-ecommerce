spring:
  application:
    name: messaging-it
  sql:
    init:
      mode: always
      schema-locations: classpath:messaging-schema.sql
  kafka:
    producer:
      properties:
        # Fail fast when a topic does not exist (auto-creation is off in these tests).
        max.block.ms: 3000

ecommerce:
  messaging:
    outbox:
      # Tests call relayOnce() directly, so runs are deterministic.
      relay-enabled: false
      initial-backoff: 200ms
      # Small batches force two relays to share the work in the competition test.
      batch-size: 4
      max-per-key: 5
