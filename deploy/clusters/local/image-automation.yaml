---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m
  # CI pushes the six images one after another and each ImageRepository scans on its own timer, so the
  # policies change over a minute or two. Without a delay that was one commit per service (s12-5);
  # with it, changes arriving within 3 minutes go into one commit, one rollout.
  policyChangeDelay: 3m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: sprint/s12-kubernetes-gitops   # the branch Flux follows; switched to main with gotk-sync.yaml
    push:
      branch: sprint/s12-kubernetes-gitops
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        deploy(local): roll out images from main

        {{ range .Changed.Changes -}}
        {{ .OldValue }} -> {{ .NewValue }}
        {{ end -}}
  update:
    path: ./deploy/apps/overlays/local
    strategy: Setters                          # only lines carrying a $imagepolicy marker change
