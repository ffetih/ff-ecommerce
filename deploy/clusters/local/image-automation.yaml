# Image automation (ADR-0013): a new image on main reaches the cluster through Git, not through a
# kubectl command. Three steps, each a Flux controller:
#   ImageRepository        scans the registry for the service's tags (every minute, anonymously: public)
#   ImagePolicy            picks the newest main-<run>-<sha> tag; the CI run number makes tags sortable
#   ImageUpdateAutomation  writes that tag into the overlay (the $imagepolicy markers) and pushes a commit
# Then the commit is deployed like any other: the apps Kustomization applies it.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: catalog-service
  namespace: flux-system
spec:
  image: ghcr.io/ffetih/ff-ecommerce/catalog-service
  interval: 1m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: catalog-service
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: catalog-service
  filterTags:
    pattern: '^main-(?P<run>[0-9]+)-[a-f0-9]{7}$'   # only images built from main
    extract: '$run'
  policy:
    numerical:
      order: asc                                     # the highest run number wins
---
