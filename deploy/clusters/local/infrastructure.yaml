# The infrastructure layers of the local cluster (ADR-0013). Flux applies each folder with Kustomize
# and keeps it equal to Git. Operators come first: the resources in later layers (Kafka, Cluster, …)
# are kinds that only exist once an operator has installed its CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  path: ./deploy/infrastructure/controllers
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 10m        # re-apply at least this often, even without a new commit: undoes manual changes
  retryInterval: 1m    # after a failure, try again sooner
  timeout: 10m
  prune: true          # delete what was removed from Git
  wait: true           # Ready only when everything it applied is ready (the operators running)
