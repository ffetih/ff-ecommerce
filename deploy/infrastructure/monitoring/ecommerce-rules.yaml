# GENERATED by scripts/prometheus-rule.sh from infra/prometheus/rules/ecommerce.yml: edit that file, then run the script.
# The Prometheus Operator loads every PrometheusRule into Prometheus; spec is a rules file.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ecommerce
spec:
  groups:
    - name: ecommerce
      rules:
        - alert: ServiceDown
          expr: up == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.service }} does not answer the metrics scrape"
            description: "Down, restarting, or rejecting the scrape token (check the target's error on /targets)."

        - alert: OutboxStuck
          # Events are written but do not reach Kafka: other services stop hearing about this one's changes.
          expr: outbox_oldest_pending_age_seconds > 30
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.service }}: oldest unpublished event is {{ $value | humanizeDuration }} old"
            description: "Kafka unreachable, or one key stuck behind a failing message. See last_error in outbox_messages."

        - alert: DeadLetters
          # A consumer gave up on a message after its retries; the saga for that key is waiting for a person.
          expr: increase(messaging_dead_letters_total[10m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }} sent a message from {{ $labels.topic }} to the dead-letter topic"
            description: "Reason: {{ $labels.exception }}. Inspect {{ $labels.topic }}-dlt and replay or fix by hand."

        - alert: HighServerErrorRate
          # namespace is kept for Alertmanager's routing in Kubernetes; compose's metrics have none.
          expr: |
            sum by (namespace, service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
              / sum by (namespace, service) (rate(http_server_requests_seconds_count[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service }}: {{ $value | humanizePercentage }} of requests fail with 5xx"
            description: "Open the failing requests' traces in Jaeger (error=true) to see which call broke."
