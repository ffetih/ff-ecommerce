server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: customer-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/customer_db}
    username: ${CUSTOMER_DB_USER:customer_service}
    password: ${CUSTOMER_DB_PASSWORD:customer_service}
  mvc:
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
