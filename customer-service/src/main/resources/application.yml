server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: customer-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/customer_db}
    username: ${CUSTOMER_DB_USER:customer_service}
    password: ${CUSTOMER_DB_PASSWORD:customer_service}
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Signing keys are discovered from the issuer; tokens must name this service in "aud".
          issuer-uri: ${ISSUER_URI:http://localhost:8180/realms/ecommerce}
          audiences: customer-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  # Traces (ADR-0011): every request and message, exported to Jaeger over OTLP. Without Jaeger
  # running, export fails quietly and the service works as before.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  # Metrics are pulled by Prometheus from /actuator/prometheus. The OpenTelemetry starter would also
  # push them over OTLP every minute; Jaeger takes traces only, so that push stays off.
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    distribution:
      # Latency buckets, so Prometheus can compute percentiles (p95) across requests and instances.
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      # /actuator/health/liveness ("restart me") and /readiness ("send me traffic"), for container
      # health checks and, in s12, Kubernetes probes. Both stay open like /actuator/health.
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
