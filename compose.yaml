# Local infrastructure for development.
# Services run on the host (IDE or ./mvnw spring-boot:run) and connect to:
#   PostgreSQL  localhost:5432
#   Kafka       localhost:9092   (containers on this network use kafka:29092)
#   Keycloak    http://localhost:8180  (realm "ecommerce"; admin console login kcadmin / kcadmin)
#   Kafka UI    http://localhost:8090   (optional: docker compose --profile tools up -d)
#
# Observability (optional: docker compose --profile observability up -d; ADR-0011):
#   Jaeger      http://localhost:16686  traces; services send OTLP to localhost:4318
#   Prometheus  http://localhost:9090   scrapes /actuator/prometheus, evaluates the alert rules
#   Grafana     http://localhost:3000   dashboard "ecommerce: overview"
#
# The whole system in containers (optional: docker compose --profile app up -d --wait; ADR-0012).
# The six services run from the images Jib builds; build them first:
#   ./mvnw package -DskipTests jib:dockerBuild
# They publish the same ports as when run from the IDE (gateway 8080, services 8081-8085), so stop
# the IDE's services first. Combine with --profile observability for traces and dashboards.
#
# Image versions are kept in sync with the Testcontainers images in test-support.

name: ecommerce

# Shared by the six services of the "app" profile. Image names follow the service; the tag is the
# project version unless IMAGE_TAG says otherwise (a CI build's short SHA, for example).
x-service: &service
  profiles: ["app"]
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    keycloak:
      condition: service_healthy
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 512M

# Inside the network every address is a service name. The issuer stays the public one (it is what the
# tokens say); the signing keys are fetched from the internal address.
x-service-env: &service-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  ISSUER_URI: http://localhost:8180/realms/ecommerce
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
  # Jaeger runs with the observability profile; without it, spans are dropped.
  OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces

# The images have no curl: speak HTTP to the readiness endpoint through bash, like Keycloak's check.
x-service-health: &service-health
  interval: 5s
  timeout: 5s
  start_period: 60s
  retries: 30

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Scripts here run once, when the data volume is created for the first time.
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    # Dev mode with its embedded database: the realm is code (infra/keycloak/import) and is
    # imported when the container is created. After editing it:
    #   docker compose up -d --force-recreate keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      # One issuer for every token, whoever asks (ADR-0012): the browser, curl and the IDE's services
      # call localhost:8180, containers call keycloak:8080, and both get iss=http://localhost:8180/...
      KC_HOSTNAME: http://localhost:8180
      # Token and key endpoints answer on whichever address they were called (the internal one).
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: kcadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-kcadmin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl: speak HTTP to the management port (9000) through bash.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1G

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    deploy:
      resources:
        limits:
          memory: 384M

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    profiles: ["observability"]
    # All in one with in-memory storage: traces are gone after a restart, which is fine locally.
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP (what the services use)
    deploy:
      resources:
        limits:
          memory: 512M

  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: ["observability"]
    # Host network: the services run on the host, and "localhost" must mean the same thing to
    # Prometheus as to them, including the Keycloak address in the scrape token's issuer.
    network_mode: host
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:13.2.4
    profiles: ["observability"]
    network_mode: host   # reaches Prometheus and Jaeger on localhost, like a browser would
    environment:
      # Local only: no login, everyone is admin. Datasources and dashboard come from infra/grafana.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ecommerce-overview.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 384M

  # --- The services, from their images (profile "app") ---------------------------------------

  catalog-service:
    <<: *service
    image: ghcr.io/ffetih/ff-ecommerce/catalog-service:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      <<: *service-env
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog_db
    ports: ["8081:8081"]
    healthcheck:
      <<: *service-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]

  customer-service:
    <<: *service
    image: ghcr.io/ffetih/ff-ecommerce/customer-service:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      <<: *service-env
      CUSTOMER_DB_URL: jdbc:postgresql://postgres:5432/customer_db
    ports: ["8082:8082"]
    healthcheck:
      <<: *service-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]

  order-service:
    <<: *service
    image: ghcr.io/ffetih/ff-ecommerce/order-service:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      <<: *service-env
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/order_db
      CATALOG_SERVICE_URL: http://catalog-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      # Its own token (client credentials) from the internal address; the issuer stays the public one.
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKENURI: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/token
    ports: ["8083:8083"]
    healthcheck:
      <<: *service-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]

  shipping-service:
    <<: *service
    image: ghcr.io/ffetih/ff-ecommerce/shipping-service:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      <<: *service-env
      SHIPPING_DB_URL: jdbc:postgresql://postgres:5432/shipping_db
    ports: ["8084:8084"]
    healthcheck:
      <<: *service-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]

  payment-service:
    <<: *service
    image: ghcr.io/ffetih/ff-ecommerce/payment-service:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      <<: *service-env
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
    ports: ["8085:8085"]
    healthcheck:
      <<: *service-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]

  gateway:
    <<: *service
    image: ghcr.io/ffetih/ff-ecommerce/gateway:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      CATALOG_SERVICE_URL: http://catalog-service:8081
      CUSTOMER_SERVICE_URL: http://customer-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      SHIPPING_SERVICE_URL: http://shipping-service:8084
      OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
    # The gateway checks no tokens itself, so it does not wait for Keycloak.
    depends_on: {}
    ports: ["8080:8080", "8089:8089"]
    healthcheck:
      <<: *service-health
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8089 && printf 'GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]

volumes:
  postgres-data:
