server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USER:order_service}
    password: ${ORDER_DB_PASSWORD:order_service}
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Each record carries the W3C traceparent of the span that sent it; consumers continue it.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    admin:
      # Topics that already exist get the declared retention as well (MessagingTopics).
      modify-topic-configs: true
    consumer:
      # Fallback only: every listener names its own group (one group per subscribed topic).
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          # Signing keys are discovered from the issuer; tokens must name this service in "aud".
          issuer-uri: ${ISSUER_URI:http://localhost:8180/realms/ecommerce}
          audiences: order-service
      client:
        # order-service's own identity for calls to customer-service and catalog-service.
        registration:
          order-service:
            provider: keycloak
            client-id: order-service
            client-secret: ${ORDER_SERVICE_CLIENT_SECRET:order-service-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            # Only the token endpoint: no discovery request at startup, so the service starts even
            # while the issuer is still coming up.
            token-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  # Traces (ADR-0011): every request and message, exported to Jaeger over OTLP. Without Jaeger
  # running, export fails quietly and the service works as before.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  # Metrics are pulled by Prometheus from /actuator/prometheus. The OpenTelemetry starter would also
  # push them over OTLP every minute; Jaeger takes traces only, so that push stays off.
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    distribution:
      # Latency buckets, so Prometheus can compute percentiles (p95) across requests and instances.
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      # /actuator/health/liveness ("restart me") and /readiness ("send me traffic"), for container
      # health checks and, in s12, Kubernetes probes. Both stay open like /actuator/health.
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

ecommerce:
  clients:
    customer:
      base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
    catalog:
      base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  orders:
    # Orders that wait too long are stopped through the normal cancellation gate (ADR-0007).
    expiry:
      placed-after: 30m
      confirmed-after: 3d
      scan-interval: 1m
      batch-size: 100
    # Goods can be returned within this time after delivery (ADR-0010).
    returns:
      window: 14d
