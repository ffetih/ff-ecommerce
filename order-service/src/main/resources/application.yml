server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USER:order_service}
    password: ${ORDER_DB_PASSWORD:order_service}
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info

ecommerce:
  clients:
    customer:
      base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
    catalog:
      base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
