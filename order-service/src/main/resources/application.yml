server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USER:order_service}
    password: ${ORDER_DB_PASSWORD:order_service}
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          # Signing keys are discovered from the issuer; tokens must name this service in "aud".
          issuer-uri: ${ISSUER_URI:http://localhost:8180/realms/ecommerce}
          audiences: order-service
      client:
        # order-service's own identity for calls to customer-service and catalog-service.
        registration:
          order-service:
            provider: keycloak
            client-id: order-service
            client-secret: ${ORDER_SERVICE_CLIENT_SECRET:order-service-secret}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            # Only the token endpoint: no discovery request at startup, so the service starts even
            # while the issuer is still coming up.
            token-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info

ecommerce:
  clients:
    customer:
      base-url: ${CUSTOMER_SERVICE_URL:http://localhost:8082}
    catalog:
      base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
