apiVersion: 1

# Dashboards are code: the JSON files in infra/grafana/dashboards. Edits made in the UI are lost on
# restart; export the JSON and commit it instead.
providers:
  - name: ecommerce
    folder: ecommerce
    type: file
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
