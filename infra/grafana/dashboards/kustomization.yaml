# The dashboards as a ConfigMap, for the Kubernetes deployment (deploy/infrastructure/monitoring).
# Compose's Grafana reads the JSON files here directly and ignores this file. In the cluster, Grafana's
# sidecar loads every ConfigMap labelled grafana_dashboard=1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: grafana-dashboards
    files:
      - ecommerce-overview.json
    options:
      labels:
        grafana_dashboard: "1"
