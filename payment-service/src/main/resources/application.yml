server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${PAYMENT_DB_USER:payment_service}
    password: ${PAYMENT_DB_PASSWORD:payment_service}
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      # Topics that already exist get the declared retention as well (MessagingTopics).
      modify-topic-configs: true
    consumer:
      # Fallback only: every listener names its own group (one group per subscribed topic).
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          # Signing keys are discovered from the issuer; tokens must name this service in "aud".
          issuer-uri: ${ISSUER_URI:http://localhost:8180/realms/ecommerce}
          audiences: payment-service

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

